---
layout: default
---
<article class="post wrap">
  <header class="post__head">
    <p class="label"><a href="{{ '/blog/' | relative_url }}">Blog</a> <span aria-hidden="true">/</span> <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time></p>
    <h1 class="post__title">{{ page.title }}</h1>
    {% if page.description %}<p class="post__dek">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <footer class="post__foot">
    <a href="{{ '/blog/' | relative_url }}">All posts</a>
    <a href="{{ '/#contact' | relative_url }}">Get in touch</a>
  </footer>
</article>
